<article class="card product-card mb-3">
    <div class="card-body">
        <h2 class="card-title">
            {{ product.name|default:"Без названия" }}
        </h2>
        <p class="card-text">
            Цена: {{ product.price }} руб.
        </p>
        <a href="{% url 'products:detail' product.id %}" class="btn btn-primary">
            Подробнее
        </a>
    </div>
</article>

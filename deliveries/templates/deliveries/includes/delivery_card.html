<article class="card delivery-card mb-3">
    <div class="card-body">
        <h2 class="card-title">
            Поставка #{{ delivery.id }}:
            {{ delivery.product.name|default:"Без названия" }}
        </h2>
        <p class="card-text">
            Поставщик: {{ delivery.supplier.name|default:"Не указан" }}
        </p>
        <p class="card-text">
            Количество: {{ delivery.quantity }} шт.
        </p>
        <p class="card-text">
            Статус: {% include "deliveries/includes/delivery_status.html" %}
        </p>
        <a href="{% url 'deliveries:detail' delivery.id %}" class="btn btn-primary">
            Подробнее
        </a>
    </div>
</article>
